# APK 를 GitHub 에서 굽는다.
#
# 왜 여기서 굽나 —
#  · 개발 PC 의 Smart App Control 이 Flutter 셰이더 컴파일러(impellerc.exe) 실행을
#    막는다. 보안 정책이고 한 번 끄면 다시 켤 수 없어 손대지 않는다
#  · 그 PC 는 사용자 이름에 한글이 들어 있어 ASCII 경로로 복사해야만 빌드된다
#    (docs/BANK.md 7절). 리눅스 러너에는 그 문제가 없다
#
# 태그를 밀면 굽고, 그 태그의 릴리즈에 APK 를 붙인다.
#   git tag -a v1.3.0 -m "…" && git push origin v1.3.0
# 릴리즈가 아직 없으면 초안으로 만든다 — 노트는 사람이 채운다.
#
# 손으로 돌릴 수도 있다 (Actions 탭 › Run workflow). 그때는 릴리즈에 안 붙이고
# 아티팩트로만 남긴다.

name: APK

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # 릴리즈에 파일을 붙이려면 필요하다

jobs:
  # 검사만 하는 자리. **코드가 바뀔 때마다 돈다.**
  #
  # 개발 PC 에 Flutter 가 없다(위 주석 참고). 그래서 여기서 걸리지 않으면
  # 잘못된 코드를 알 길이 없다 — 태그를 밀 때까지 기다릴 일이 아니다.
  # APK 를 굽지 않으므로 몇 분이면 끝난다.
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17' # build.gradle.kts 가 JVM 17 을 쓴다

      - uses: subosito/flutter-action@v2
        with:
          # 개발 PC 와 같은 채널·버전으로 굽는다. 다르면 여기서만 나는 문제가 생긴다.
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: 의존성
        run: flutter pub get

      - name: 정적 검사
        run: flutter analyze

      # 화면을 볼 수 없는 환경에서 눈 대신 쓰는 것들. 모두 순수 Dart 라
      # 러너에서도 그대로 돈다.
      - name: 발문·선지 텍스트 검증
        run: dart run tool/check_text.dart

      - name: 백업 왕복 검증
        run: dart run tool/check_backup.dart

      - name: 오답노트 인쇄본 검증
        run: dart run tool/check_note_html.dart

      - name: 복습 알림 일정 검증
        run: dart run tool/check_reminder.dart

      - name: 통계 집계 검증
        run: dart run tool/check_stats.dart

      # 여기서 값이 새면 사용자의 풀이 기록이 조용히 사라지고 되돌릴 수 없다.
      - name: 기록 ↔ 테이블 행 왕복 검증
        run: dart run tool/check_db_rows.dart

      - name: 아이콘 검증
        working-directory: .
        run: |
          python -m pip install --quiet Pillow
          python tools/make_icons.py --check

      # 문항이 인용한 법령 조문이 원문과 한 글자도 다르지 않은지 본다.
      # 조문을 지어내지 않는다는 규율(bank/README.md)을 기계로 지키는 자리다.
      # 가상 규정 회차는 대조 대상이 0건이라 그냥 지나간다.
      - name: 법령 인용 검증
        working-directory: .
        run: |
          for r in r1_public r2_korail r3_korail r4_korail r5_nhis; do
            python tools/law_text.py check bank/_law/_all.txt --round "$r"
          done

  build:
    needs: checks # 검사가 통과해야 굽는다
    # 태그를 밀었거나 손으로 돌렸을 때만. 보통 푸시에는 굽지 않는다.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true

      - name: 의존성
        run: flutter pub get

      - name: APK
        run: flutter build apk --release

      - name: 이름에 버전을 박는다
        id: name
        run: |
          v=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp build/app/outputs/flutter-apk/app-release.apk "ncs-bank-v$v.apk"
          echo "file=mobile/ncs-bank-v$v.apk" >> "$GITHUB_OUTPUT"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v5
        with:
          name: ncs-bank-v${{ steps.name.outputs.version }}
          path: ${{ steps.name.outputs.file }}
          retention-days: 30

      # 태그로 굴러온 경우에만 릴리즈에 붙인다. 손으로 돌린 것은 아티팩트로 끝.
      - name: 릴리즈에 붙이기
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --draft --title "$tag" \
              --notes "노트를 채워 주세요. APK 는 붙어 있습니다."
          fi
          gh release upload "$tag" \
            "${{ steps.name.outputs.file }}#NCS 기출은행 $tag (Android APK)" --clobber
