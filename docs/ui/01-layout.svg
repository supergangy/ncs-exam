고정하는 요소는 <tspan font-weight='700' fill='#0f172a'>모바일 하단 탭 하나뿐</tspan>이다</text><text x='62' y='696' font-family='Pretendard, Malgun Gothic, 맑은 고딕, -apple-system, sans-serif' font-size='12' fill='#64748b' text-anchor='start' font-weight='400'>· 머리말은 늘 보인다 — 버전과 문항 수를 상주시킨다</text><text x='62' y='716' font-family='Pretendard, Malgun Gothic, 맑은 고딕, -apple-system, sans-serif' font-size='12' fill='#64748b' text-anchor='start' font-weight='400'>· 접힐 때 <tspan font-weight='700' fill='#0f172a'>문항 본문의 최소 폭 560을 먼저 지킨다.</tspan> 좌 내비 → 서랍, 번호판 → 시트 순으로 접는다</text><text x='62' y='736' font-family='Pretendard, Malgun Gothic, 맑은 고딕, -apple-system, sans-serif' font-size='12' fill='#64748b' text-anchor='start' font-weight='400'>· 표·SVG 는 가로 스크롤 컨테이너에 담아 본문이 밀리지 않게 한다</text><rect x='44' y='750' width='1000' height='84' rx='11' fill='#fff1f2'/><rect x='44' y='764' width='3' height='56' rx='1.5' fill='#c2334d'/><text x='62' y='778' font-family='Pretendard, Malgun Gothic, 맑은 고딕, -apple-system, sans-serif' font-size='12' fill='#c2334d' text-anchor='start' font-weight='700'>지금 코드의 결함 — 이래서 새로 만든다</text><text x='62' y='798' font-family='Pretendard, Malgun Gothic, 맑은 고딕, -apple-system, sans-serif' font-size='12' fill='#64748b' text-anchor='start' font-weight='400'>· app.css 261·277·314행이 모두 position: fixed; bottom: 0 이다. 셋이 서로 덮어 <tspan font-weight='700' fill='#0f172a'>제출 버튼이 안 눌린다</tspan></text><text x='62' y='818' font-family='Pretendard, Malgun Gothic, 맑은 고딕, -apple-system, sans-serif' font-size='12' fill='#64748b' text-anchor='start' font-weight='400'>· @media 질의가 다크모드 하나뿐이라 화면 폭 분기가 없다. PC 에서도 좁은 칼럼이다</text></svg>